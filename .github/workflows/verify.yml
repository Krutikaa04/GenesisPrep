name: Verify salvage
on:
  push:
    branches: [master, m3]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-and-offline-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Unit tests and organizer references
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          python tools/compare_expected.py
      - name: Measured damage evaluation
        run: python tools/evaluate.py --json evaluation.json
      - name: Preload pinned base image
        run: docker pull python:3.12-slim@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
      - name: Build offline and compare native with isolated Docker run
        run: SALVAGE_PYTHON=python tools/docker_check.sh
